name: Build Firmware

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 NAT Router Build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build

      - name: Create merged binary
        shell: bash
        run: |
          cd build
          python -m esptool \
            --chip esp32s3 \
            merge-bin \
            -o merged.bin \
            -f raw \
            @flash_args

      - name: Collect firmware artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp build/bootloader/bootloader.bin \
             artifacts/bootloader.bin

          cp build/partition_table/partition-table.bin \
             artifacts/partition-table.bin

          cp build/ota_data_initial.bin \
             artifacts/ota_data_initial.bin

          cp build/phy_init_data.bin \
             artifacts/phy_init_data.bin

          cp build/esp32s3_nat_router.bin \
             artifacts/esp32s3_nat_router.bin

          cp build/merged.bin \
             artifacts/merged.bin

          cp build/flash_args \
             artifacts/flash_args

          ls -lh artifacts

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-NAT-Router
          path: artifacts/
          if-no-files-found: error
